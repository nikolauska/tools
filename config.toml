[settings]
lockfile = true

[settings.github]
credential_command = "gh auth token"

[tools]
# Node 24 satisfies the highest runtime requirement of the npm tools below.
node = "24"

# Dependencies used by wrapper CLIs.
gh = "latest"
glab = "latest"

# npm CLI tools
"npm:acpx" = "latest"
"npm:chrome-devtools-axi" = "latest"
"npm:@nikolauska/cbm-axi" = "latest"
"npm:gh-axi" = "latest"
"npm:@github/copilot" = "latest"
"npm:gnhf" = "latest"
"npm:lavish-axi" = "latest"
"npm:@nikolauska/linear-axi" = "latest"
"npm:quota-axi" = "latest"
"npm:@nikolauska/sentry-axi" = "latest"
"npm:@jkeskikangas/skillcheck" = "latest"
"npm:skills" = "latest"
"npm:tasks-axi" = "latest"

# GitHub release binaries
"github:cniska/acolyte" = { version = "latest", matching = "acolyte" }
"github:agent-sh/agnix" = { version = "latest", matching = "agnix" }
"github:lucassabreu/clockify-cli" = { version = "latest", matching = "clockify-cli" }
"github:DeusData/codebase-memory-mcp" = { version = "latest", matching = "codebase-memory-mcp" }
"github:AltanS/collie" = { version = "latest", matching = "collie-", os = [
  "linux",
  "macos",
] }
"github:remoteoss/dexter" = { version = "latest", matching = "dexter_", os = [
  "linux",
  "macos",
] }
"github:nikolauska/glab-axi" = { version = "latest", matching = "glab-axi", bin = "glab-axi" }
"github:herdrdev/herdr" = { version = "latest", matching = "herdr-", bin = "herdr" }
"github:kunchenguid/no-mistakes" = { version = "latest", prerelease = true, matching = "no-mistakes" }
"github:can1357/oh-my-pi" = { version = "latest", matching_regex = "^omp-", bin = "omp" }
"github:earendil-works/pi" = { version = "latest", matching_regex = "^pi-" }
"github:DataDog/pup" = { version = "latest", matching = "pup_" }
"github:getsentry/cli" = { version = "latest", matching_regex = "^sentry-", rename_exe = "sentry" }
"github:stripe/stripe-mock" = { version = "latest", matching = "stripe-mock" }
"github:kunchenguid/treehouse" = { version = "latest", matching = "treehouse" }

# SonarQube CLI publishes platform binaries outside GitHub releases.
[tools."http:sonarqube-cli"]
version = "latest"
version_list_url = "https://binaries.sonarsource.com/Distribution/sonarqube-cli/stable.version"
bin = "sonar"
os = ["linux", "macos", "windows"]

[tools."http:sonarqube-cli".platforms.linux-x64]
url = "https://binaries.sonarsource.com/Distribution/sonarqube-cli/{{ version }}/linux/sonarqube-cli-{{ version }}-linux-x86-64.bin"

[tools."http:sonarqube-cli".platforms.linux-arm64]
url = "https://binaries.sonarsource.com/Distribution/sonarqube-cli/{{ version }}/linux/sonarqube-cli-{{ version }}-linux-arm64.bin"

[tools."http:sonarqube-cli".platforms.macos-arm64]
url = "https://binaries.sonarsource.com/Distribution/sonarqube-cli/{{ version }}/macos/sonarqube-cli-{{ version }}-macos-arm64.bin"

[tools."http:sonarqube-cli".platforms.windows-x64]
url = "https://binaries.sonarsource.com/Distribution/sonarqube-cli/{{ version }}/windows/sonarqube-cli-{{ version }}-windows-x86-64.exe"
bin = "sonar.exe"

# Friendly names for backend-qualified tools.
[tool_alias]
acolyte = "github:cniska/acolyte"
acpx = "npm:acpx"
agnix = "github:agent-sh/agnix"
chrome-devtools-axi = "npm:chrome-devtools-axi"
clockify-cli = "github:lucassabreu/clockify-cli"
codebase-memory-mcp = "github:DeusData/codebase-memory-mcp"
codebase-memory-mcp-axi = "npm:@nikolauska/cbm-axi"
collie = "github:AltanS/collie"
copilot = "npm:@github/copilot"
dexter = "github:remoteoss/dexter"
gh-axi = "npm:gh-axi"
glab-axi = "github:nikolauska/glab-axi"
gnhf = "npm:gnhf"
herdr = "github:ogulcancelik/herdr"
lavish-axi = "npm:lavish-axi"
linear-axi = "npm:@nikolauska/linear-axi"
no-mistakes = "github:kunchenguid/no-mistakes"
omp = "github:can1357/oh-my-pi"
pup = "github:DataDog/pup"
quota-axi = "npm:quota-axi"
sentry-axi = "npm:@nikolauska/sentry-axi"
sentry-cli = "github:getsentry/cli"
skillcheck = "npm:@jkeskikangas/skillcheck"
skills = "npm:skills"
sonarqube-cli = "http:sonarqube-cli"
stripe-mock = "github:stripe/stripe-mock"
tasks-axi = "npm:tasks-axi"
treehouse = "github:kunchenguid/treehouse"

# codebase-memory-mcp has no public foreground daemon command yet. Its internal
# permanent-daemon mode keeps the process attached to the service manager;
# replace these flags when upstream exposes a supported equivalent.
[bootstrap.services.codebase-memory-mcp]
scope = "user"
command = "mise exec -- codebase-memory-mcp --cbm-daemon-internal --cbm-daemon-permanent"
description = "Keep the Codebase Memory MCP daemon warm for CLI commands"
restart = "on-failure"
requires_tools = true

[tasks.update]
description = "Upgrade all mise-managed tools and refresh the lockfile"
run = ["mise upgrade", "mise lock --global"]

[tasks.status]
description = "Show mise-managed tool status"
run = ["mise current", "mise outdated"]

[tasks.bootstrap]
description = "Install tools and apply services"
run = [
  "mise install --locked",
  "mise bootstrap services apply --yes",
]
